name: Accessibility
description: Report a barrier involving assistive technology, content size, contrast, motion, input, or comprehension.
title: "[Accessibility]: "
labels: [accessibility]
body:
  - type: markdown
    attributes:
      value: Share only redacted evidence. Never include journal content, voice recordings, credentials, device identifiers, or signing/configuration values.
  - type: input
    id: environment
    attributes:
      label: Device, OS, app revision, and locale
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Accessibility area
      options: [VoiceOver, Dynamic Type, Contrast or color, Reduce Motion or Transparency, Keyboard or pointer, Switch Control, Orientation or Stage Manager, Captions or transcript, Garden description, Cognitive or language clarity, Other]
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Exact settings and starting state
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: Steps, expected access, and observed barrier
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence or suggested improvement
