name = "arrivewithin-web"
main = "worker.mjs"
compatibility_date = "2026-09-22"
account_id = "0317b000520a8e6b237de500c592d67a"
workers_dev = false
preview_urls = false

# The custom domain is intentionally absent until the DNS owner coordinates the
# cutover. Ingest URL/token secrets are added only after the backend recovery gate.
[vars]
ANALYTICS_SITE_HOSTNAME = "arrivewithin.com"

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
# Run the Worker only for document routes and preference controls. Other static
# assets remain asset-first and avoid unnecessary Worker invocations.
run_worker_first = [
  "/",
  "/de",
  "/support",
  "/de/support",
  "/privacy",
  "/de/privacy",
  "/open-source",
  "/de/open-source",
  "/analytics/*",
]
