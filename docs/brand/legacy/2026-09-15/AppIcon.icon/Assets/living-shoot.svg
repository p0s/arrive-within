<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <filter id="shootDepth" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#263A2C" flood-opacity="0.30"/>
    </filter>
    <filter id="shootTexture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.060" numOctaves="2" seed="67" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="monochromeNoise"/>
